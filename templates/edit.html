<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student</title>
    <link rel="stylesheet" href="../static/css/styles.css">
</head>

<body>
    <h1>Edit Student Information</h1>
    <form action="{{ url_for('edit', id=record['_id']|string) }}" method="post" class="student-form">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" value="{{ record['Name'] }}" required>
        <br>

        <label for="section">Section:</label>
        <div class="radio-group">
            <input type="radio" id="section_a" name="section" value="A" {% if record['Section']=='A' %}checked{% endif
                %}>
            <label for="section_a">A</label>

            <input type="radio" id="section_b" name="section" value="B" {% if record['Section']=='B' %}checked{% endif
                %}>
            <label for="section_b">B</label>

            <input type="radio" id="section_c" name="section" value="C" {% if record['Section']=='C' %}checked{% endif
                %}>
            <label for="section_c">C</label>
        </div>
        <br>

        <label for="roll_number">Roll Number:</label>
        <input type="text" id="roll_number" name="roll_number" value="{{ record['Roll No'] }}" required>
        <br>

        <button type="submit">Update</button>
    </form>
    <form action="/information" method="get">
        <button type="submit">Cancel</button>
    </form>
</body>

</html>
